  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #ffffff; color: #0f172a; }
    
    /* Scrollbars */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(241, 245, 249, 0.8); }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(203, 213, 225, 0.8); border-radius: 99px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 1); }

    /* iPhone Frame */
    .iphone-case {
      width: 365px;
      height: 690px;
      background: #1c1c1e;
      border-radius: 46px;
      padding: 12px;
      position: relative;
      box-shadow: 0 0 0 1.5px #e2e8f0, 0 20px 40px rgba(0,0,0,0.15);
      flex-shrink: 0;
    }
    .iphone-case::before {
      content: ''; position: absolute; left: -3px; top: 100px; width: 3px; height: 32px; background: #3a3a3c; border-radius: 2px 0 0 2px;
      box-shadow: 0 44px 0 #3a3a3c, 0 88px 0 #3a3a3c;
    }
    .iphone-case::after {
      content: ''; position: absolute; right: -3px; top: 140px; width: 3px; height: 58px; background: #3a3a3c; border-radius: 0 2px 2px 0;
    }

    .iphone-screen {
      background: #ECE5DD;
      border-radius: 34px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
    }

    .dynamic-island {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      width: 92px; height: 26px; background: #1c1c1e; border-radius: 20px; z-index: 30;
      display: flex; align-items: center; justify-content: flex-end; padding-right: 10px;
    }
    .camera-lens { width: 10px; height: 10px; border-radius: 50%; background: #0c0c0e; border: 1px solid #2c2c2e; }

    /* Keyframe Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up { animation: fadeUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    @keyframes pulseDot {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    .dot-1 { animation: pulseDot 1.4s infinite 0s; }
    .dot-2 { animation: pulseDot 1.4s infinite 0.2s; }
    .dot-3 { animation: pulseDot 1.4s infinite 0.4s; }

    @keyframes rippleCall {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 0.4; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .call-ripple { animation: rippleCall 2s infinite ease-in-out; }
  </style>
</head>

                { label: "Rating", val: "5 / 5 Star (Sangat Puas)" },
                { label: "Poli", val: "Poli Bedah VIP" }
              ],
              status: "FEEDBACK RECORDED"
            }
          }
        ]
      },
      {
        id: "diag16_nearby",
        name: "16. Cari Klinik Terdekat",
        title: "16. Cari Klinik Terdekat (Share Location WhatsApp)",
        tag: "Location WA",
        triggerType: "INBOUND_USER",
        description: "Pencarian cabang klinik terdekat dari posisi pasien. Pasien membagikan titik lokasi via fitur Share Location WhatsApp, n8n menguraikan Latitude & Longitude, lalu menampilkan klinik terdekat dalam radius 20 KM.",
        cekatComponents: ["AI Agent + Tool (tangkap koordinat)", "n8n (hit API SIMRS lat/long/kota)", "Knowledge Source (koordinat cabang fallback)", "WhatsApp Share Location"],
        apiScopes: ["GET nearest clinic -> parameter lat, long, dan/atau kota"],
        ruleNote: "Perhitungan jarak butuh koordinat pasti — Share Location wajib; hanya tersedia di kanal WhatsApp.",
        stepsDetail: [
          "Step 1 — Ask: Pasien minta klinik/cabang terdekat (kanal WhatsApp).",
          "Step 2 — Share Location: AI minta Share Location WA lalu ambil latitude & longitude (bukan nama kota).",
          "Step 3 — Route: Ada API SIMRS -> GET klinik terdekat; tidak ada -> hitung dari koordinat di Knowledge.",
          "Step 4 — Compute: Fallback statis: tiap cabang wajib punya lat/long; filter radius mis. 20 KM.",
          "Step 5 — Show: Tampilkan daftar klinik terdekat + alamat/peta; fallback non-WA: sebut kota manual."
        ],
        initialText: "Klinik terdekat dari lokasi saya di mana ya?",
        steps: [
          {
            userReply: "📍 Share Live Location",
            aiResponse: "📍 Lokasi Klinik Terdekat (Radius 5 KM):\n1. *Klinik Menteng* (2.1 km)\n2. *Klinik Cikini* (4.3 km)",
            chips: ["🗺️ Maps Menteng", "📞 Telp Menteng"],
            card: {
              title: "📍 Klinik Menteng (2.1 KM)",
              sub: "Jl. Cikini Raya No. 45",
              items: [
                { label: "Distance", val: "2.1 KM" },
                { label: "Hours", val: "s/d 21:00 WIB" }
              ],
              status: "KLINIK BUKA"
            }
          }
        ]
      }
    ];

    let currentScenario = workflows[0];
    let currentStepIdx = 0;
    let isPlaying = true;
    let playbackSpeed = 1;
    let soundEnabled = false;
    let timer = null;

    // WA Call State Variables
    let callTimerInterval = null;
    let callSeconds = 0;
    let isCallMuted = false;

    // Sound Synthesizer
    function playAudio(type) {
      if (!soundEnabled) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        const now = ctx.currentTime;
        if (type === 'send') {
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.start(now); osc.stop(now + 0.08);
        } else if (type === 'call_ring') {
          osc.frequency.setValueAtTime(523, now);
          osc.frequency.exponentialRampToValueAtTime(659, now + 0.2);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'call_end') {
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.exponentialRampToValueAtTime(200, now + 0.25);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.start(now); osc.stop(now + 0.25);
        } else {
          osc.frequency.setValueAtTime(600, now);
          osc.frequency.exponentialRampToValueAtTime(400, now + 0.1);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
          osc.start(now); osc.stop(now + 0.1);
        }
      } catch(e) {}
    }

    // Dummy WA Call Handlers
    function startDummyCall(contactName = "Dr. Budi, Sp.A", callType = "WhatsApp Voice Call") {
      const modal = document.getElementById('wa-call-modal');
      document.getElementById('call-contact-name').innerText = contactName;
      document.getElementById('call-status-label').innerText = callType;
      document.getElementById('call-avatar-text').innerText = contactName.startsWith('Hotline') ? '119' : 'RS';
      
      callSeconds = 0;
      document.getElementById('call-timer').innerText = "Calling...";
      modal.classList.remove('hidden');

      playAudio('call_ring');

      clearInterval(callTimerInterval);
      setTimeout(() => {
        document.getElementById('call-timer').innerText = "00:00";
        callTimerInterval = setInterval(() => {
          callSeconds++;
          const mins = String(Math.floor(callSeconds / 60)).padStart(2, '0');
          const secs = String(callSeconds % 60).padStart(2, '0');
          document.getElementById('call-timer').innerText = `${mins}:${secs}`;
        }, 1000);
      }, 1500);
    }

    function endDummyCall() {
      clearInterval(callTimerInterval);
      const modal = document.getElementById('wa-call-modal');
      modal.classList.add('hidden');
      playAudio('call_end');

      const mins = String(Math.floor(callSeconds / 60)).padStart(2, '0');
      const secs = String(callSeconds % 60).padStart(2, '0');
      const durationStr = `${mins}:${secs}`;

      // Append inline call ended banner to chat
      const canvas = document.getElementById('chat-canvas');
      const banner = document.createElement('div');
      banner.className = 'flex justify-center my-2 animate-fade-up';
      banner.innerHTML = `<span class="bg-slate-200 text-slate-700 border border-slate-300 text-[10.5px] font-semibold px-3 py-1 rounded-full"><i class="fa-solid fa-phone-slash text-red-500 mr-1"></i> Panggilan WhatsApp Selesai (${durationStr})</span>`;
      canvas.appendChild(banner);
      canvas.scrollTop = canvas.scrollHeight;
    }

    function toggleMuteCall() {
      isCallMuted = !isCallMuted;
      const btn = document.getElementById('btn-call-mute');
      if (isCallMuted) {
        btn.className = "w-12 h-12 rounded-full bg-red-600/20 text-red-500 border border-red-500/40 flex items-center justify-center transition shadow-md";
      } else {
        btn.className = "w-12 h-12 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-200 flex items-center justify-center transition shadow-md";
      }
    }

    // Render Tabs
    function renderTabs() {
      const container = document.getElementById('tabs-container');
      container.innerHTML = '';
      workflows.forEach(wf => {
        const btn = document.createElement('button');
        btn.className = `px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition border ${
          wf.id === currentScenario.id 
            ? 'bg-blue-600 border-blue-600 text-white shadow-xs' 
            : 'bg-white border-slate-200 text-slate-600 hover:text-slate-900 hover:bg-slate-50'
        }`;
        btn.innerHTML = `${wf.name}`;
        btn.onclick = () => selectScenario(wf.id);
        container.appendChild(btn);
      });
    }

    function selectScenario(id) {
      currentScenario = workflows.find(w => w.id === id);
      renderTabs();
      renderSpecPanel();
      restartCurrentScenario();
    }

    function renderSpecPanel() {
      const panel = document.getElementById('architecture-panel');
      let compHtml = currentScenario.cekatComponents.map(c => `<span class="bg-amber-50 border border-amber-200 text-amber-800 font-mono text-[11px] px-2.5 py-1 rounded-md inline-block mr-1 mb-1 font-semibold">${c}</span>`).join('');
      let apiHtml = currentScenario.apiScopes.map(a => `<span class="bg-blue-50 border border-blue-200 text-blue-800 font-mono text-[11px] px-2.5 py-1 rounded-md inline-block mr-1 mb-1 font-semibold">${a}</span>`).join('');
      
      let flowStepsHtml = currentScenario.stepsDetail.map((s, idx) => `
        <div class="flex items-start gap-3 p-2.5 bg-white border border-slate-200 rounded-xl shadow-xs">
          <div class="w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold shrink-0 text-[11px]">
            ${idx + 1}
          </div>
          <div class="leading-relaxed text-[11.5px] text-slate-700 font-medium">
            ${s}
          </div>
        </div>
      `).join('');

      let triggerBadgeHtml = currentScenario.triggerType === 'OUTBOUND_SYSTEM'
        ? `<span class="bg-emerald-100 text-emerald-800 border border-emerald-300 font-bold px-2.5 py-0.5 rounded-full text-[10px]">SYSTEM OUTBOUND TRIGGER</span>`
        : `<span class="bg-blue-100 text-blue-800 border border-blue-300 font-bold px-2.5 py-0.5 rounded-full text-[10px]">USER INBOUND CHAT</span>`;

      panel.innerHTML = `
        <!-- Title & Category Header -->
        <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-2">
          <div class="font-extrabold text-sm text-blue-700 flex items-center gap-2">
            <i class="fa-solid fa-sitemap"></i> ${currentScenario.title}
          </div>
          <div class="flex items-center gap-2 pt-1">
            ${triggerBadgeHtml}
            <span class="bg-slate-200 text-slate-700 font-mono font-bold px-2.5 py-0.5 rounded-full text-[10px] border border-slate-300">${currentScenario.tag}</span>
          </div>
        </div>

        <!-- 📌 Description Card -->
        <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-1.5">
          <div class="font-bold text-amber-700 flex items-center gap-2 text-xs">
            <i class="fa-solid fa-circle-info"></i> Deskripsi Skenario & Tujuan
          </div>
          <p class="text-slate-700 leading-relaxed text-[11.5px]">${currentScenario.description}</p>
        </div>

        <!-- 🔄 Visual Step-by-Step Flowchart Card -->
        <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-2">
          <div class="font-bold text-blue-700 flex items-center gap-2 text-xs mb-1">
            <i class="fa-solid fa-diagram-project"></i> Alur Percakapan & Flowchart
          </div>
          <div class="space-y-2">
            ${flowStepsHtml}
          </div>
        </div>

        <!-- 🛠️ Cekat Components Card -->
        <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-2">
          <div class="font-bold text-blue-700 flex items-center gap-2 text-xs">
            <i class="fa-solid fa-microchip"></i> Komponen Cekat AI
          </div>
          <div>${compHtml}</div>
        </div>

        <!-- 🔌 API Scopes Card -->
        <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-2">
          <div class="font-bold text-blue-700 flex items-center gap-2 text-xs">
            <i class="fa-solid fa-network-wired"></i> Scope API & Integrasi
          </div>
          <div>${apiHtml}</div>
        </div>

        <!-- 🛡️ Architecture Rule Note -->
        <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-1">
          <div class="font-bold text-blue-700 flex items-center gap-2 text-xs">
            <i class="fa-solid fa-shield-halved"></i> Key Architecture Safeguard & Rule
          </div>
          <p class="text-slate-700 italic text-[11.5px] leading-relaxed">${currentScenario.ruleNote}</p>
        </div>
      `;
    }

    function restartCurrentScenario() {
      clearTimeout(timer);
      currentStepIdx = 0;
      const canvas = document.getElementById('chat-canvas');
      canvas.innerHTML = '';

      // Time Divider
      const div = document.createElement('div');
      div.className = 'flex items-center gap-2 my-2 animate-fade-up';
      div.innerHTML = `<div class="h-px bg-slate-300 flex-1"></div><span class="text-[10px] text-slate-500 font-semibold bg-[#ECE5DD] px-2">HARI INI</span><div class="h-px bg-slate-300 flex-1"></div>`;
      canvas.appendChild(div);

      // If OUTBOUND_SYSTEM: Render System Pill & RS Bot Message First (on LEFT)!
      if (currentScenario.triggerType === 'OUTBOUND_SYSTEM') {
        if (currentScenario.outboundPill) {
          const pill = document.createElement('div');
          pill.className = 'flex justify-center my-1 animate-fade-up';
          pill.innerHTML = `<span class="bg-white text-blue-700 border border-blue-200 text-[10px] font-bold px-3 py-0.5 rounded-full shadow-xs">${currentScenario.outboundPill}</span>`;
          canvas.appendChild(pill);
        }
        
        // Outbound Msg from RS Bot -> KIRI ('rs-bot')
        appendMsg('rs-bot', currentScenario.initialText);
        renderChips(currentScenario.steps[0]?.chips || []);

        if (isPlaying && currentScenario.steps.length > 0) {
          timer = setTimeout(() => {
            runStep(0, currentScenario.steps[0].userReply);
          }, 2200 / playbackSpeed);
        }
      } else {
        // INBOUND_USER: Initial Msg from Patient -> KANAN ('patient')
        appendMsg('patient', currentScenario.initialText);
        renderChips(currentScenario.steps[0]?.chips || []);

        if (isPlaying && currentScenario.steps.length > 0) {
          timer = setTimeout(() => {
            runStep(0, currentScenario.steps[0].userReply);
          }, 1600 / playbackSpeed);
        }
      }
    }

    /* Standard WhatsApp Alignment Rules:
       - rs-bot (RS Sehat Utama / Bot) -> KIRI (flex-start, White Bubble #ffffff)
       - patient (Pasien / User) -> KANAN (flex-end, Light Green #d9fdd3)
    */
    function appendMsg(senderRole, text) {
      const canvas = document.getElementById('chat-canvas');
      const isBot = senderRole === 'rs-bot';

      const wrap = document.createElement('div');
      wrap.className = `flex flex-col ${isBot ? 'items-start' : 'items-end'} mb-2 animate-fade-up`;

      const bubble = document.createElement('div');
      bubble.className = `${
        isBot 
          ? 'bg-white text-slate-900 rounded-2xl rounded-tl-none border border-slate-100 shadow-sm' 
          : 'bg-[#d9fdd3] text-slate-900 rounded-2xl rounded-tr-none border border-[#c7f3be] shadow-sm'
      } px-3 py-2 text-xs leading-relaxed max-w-[85%] whitespace-pre-line`;
      
      bubble.innerHTML = text.replace(/\*(.*?)\*/g, '<strong>$1</strong>');

      const ts = document.createElement('span');
      ts.className = 'text-[9.5px] text-slate-400 mt-0.5 font-medium px-1 flex items-center gap-1';
      ts.innerHTML = `${new Date().toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'})} ${!isBot ? '<i class="fa-solid fa-check-double text-sky-500"></i>' : ''}`;

      wrap.appendChild(bubble);
      wrap.appendChild(ts);
      canvas.appendChild(wrap);
      canvas.scrollTop = canvas.scrollHeight;

      playAudio(!isBot ? 'send' : 'receive');
    }

    function appendCard(cardObj) {
      if (!cardObj) return;
      const canvas = document.getElementById('chat-canvas');
      const wrap = document.createElement('div');
      wrap.className = 'flex flex-col items-start mb-2 animate-fade-up max-w-[90%]';

      let itemsHtml = cardObj.items.map(item => `
        <div class="flex justify-between items-center py-1 border-t border-slate-100 text-[11px] gap-4">
          <span class="text-slate-500 font-medium">${item.label}</span>
          <span class="text-slate-900 font-bold text-right">${item.val}</span>
        </div>
      `).join('');

      wrap.innerHTML = `
        <div class="bg-white rounded-2xl overflow-hidden shadow-md border border-slate-200 w-full text-xs">
          <div class="p-3">
            <div class="font-extrabold text-[#075E54] text-xs flex items-center gap-1.5 mb-0.5">
              <i class="fa-solid fa-circle-check"></i> ${cardObj.title}
            </div>
            <div class="text-[10px] text-slate-400 mb-2 font-medium">${cardObj.sub}</div>
            ${itemsHtml}
          </div>
          <div class="bg-[#075E54] text-white text-[10px] font-bold py-1.5 px-3 text-center tracking-wide uppercase">
            ${cardObj.status}
          </div>
        </div>
      `;

      canvas.appendChild(wrap);
      canvas.scrollTop = canvas.scrollHeight;
    }

    function renderChips(chipsList) {
      const row = document.getElementById('quick-chips');
      if (!row) return;
      row.innerHTML = '';
      if (!chipsList) return;

      chipsList.forEach(txt => {
        const chip = document.createElement('button');
        chip.className = 'bg-white hover:bg-slate-50 text-[#075E54] border border-[#075E54] text-[11px] font-semibold px-3 py-1 rounded-full whitespace-nowrap shadow-xs cursor-pointer active:scale-95 transition shrink-0';
        chip.innerText = txt;
        chip.onclick = () => onChipClick(txt);
        row.appendChild(chip);
      });
    }

    function onChipClick(txt) {
      clearTimeout(timer);
      if (txt.includes('Telepon') || txt.includes('Panggilan')) {
        let contact = "Dr. Budi, Sp.A";
        if (txt.includes('119') || txt.includes('Hotline')) contact = "Hotline IGD 119";
        startDummyCall(contact, "WhatsApp Voice Call");
        return;
      }
      if (currentStepIdx < currentScenario.steps.length) {
        runStep(currentStepIdx, txt);
      }
    }

    function handleManualSend() {
      const input = document.getElementById('user-input-field');
      const val = input.value.trim();
      if (val) {
        onChipClick(val);
        input.value = '';
      }
    }

    function runStep(stepIdx, userText) {
      // Pasien Balas -> KANAN ('patient')
      appendMsg('patient', userText);

      // Typing Dots -> KIRI ('rs-bot')
      const canvas = document.getElementById('chat-canvas');
      const typing = document.createElement('div');
      typing.className = 'flex flex-col items-start mb-2 animate-fade-up';
      typing.id = 'typing-dots';
      typing.innerHTML = `
        <div class="bg-white rounded-2xl rounded-tl-none px-3.5 py-2 shadow-sm border border-slate-100 flex items-center gap-1">
          <span class="w-1.5 h-1.5 rounded-full bg-[#075E54] dot-1"></span>
          <span class="w-1.5 h-1.5 rounded-full bg-[#075E54] dot-2"></span>
          <span class="w-1.5 h-1.5 rounded-full bg-[#075E54] dot-3"></span>
        </div>
      `;
      canvas.appendChild(typing);
      canvas.scrollTop = canvas.scrollHeight;

      timer = setTimeout(() => {
        const t = document.getElementById('typing-dots');
        if (t) t.remove();

        const step = currentScenario.steps[stepIdx];
        const botResponse = step ? step.aiResponse : "Terima kasih! Ada hal lain yang bisa Cekat AI bantu?";
        // Bot RS Balas -> KIRI ('rs-bot')
        appendMsg('rs-bot', botResponse);

        if (step && step.card) {
          appendCard(step.card);
        }

        if (step && step.chips) {
          renderChips(step.chips);
        }

        currentStepIdx = stepIdx + 1;

        if (isPlaying && currentStepIdx < currentScenario.steps.length) {
          timer = setTimeout(() => {
            const nextStep = currentScenario.steps[currentStepIdx];
            runStep(currentStepIdx, nextStep.userReply);
          }, 3000 / playbackSpeed);
        }
      }, 2000 / playbackSpeed);
    }

    function togglePlayPause() {
      isPlaying = !isPlaying;
      const btn = document.getElementById('btn-play-toggle');
      const icon = document.getElementById('icon-play');
      const text = document.getElementById('text-play');

      if (isPlaying) {
        btn.className = "flex items-center gap-1.5 bg-amber-50 text-amber-700 border border-amber-200 px-3 py-1 rounded-full font-semibold transition hover:bg-amber-100";
        icon.className = "fa-solid fa-pause text-xs";
        text.innerText = "Pause";
        restartCurrentScenario();
      } else {
        btn.className = "flex items-center gap-1.5 bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1 rounded-full font-semibold transition hover:bg-emerald-100";
        icon.className = "fa-solid fa-play text-xs";
        text.innerText = "Play";
        clearTimeout(timer);
      }
    }

    function setSpeed(sp) {
      playbackSpeed = sp;
      document.querySelectorAll('.speed-btn').forEach(btn => {
        btn.className = btn.innerText === `${sp}x` 
          ? 'speed-btn px-2 py-0.5 rounded font-mono font-bold text-xs bg-blue-600 text-white'
          : 'speed-btn px-2 py-0.5 rounded font-mono font-bold text-xs text-slate-600 hover:text-slate-900 hover:bg-slate-100';
      });
      if (isPlaying) restartCurrentScenario();
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const icon = document.getElementById('icon-sound');
      const btn = document.getElementById('btn-sound-toggle');

      if (soundEnabled) {
        icon.className = "fa-solid fa-volume-high text-xs text-blue-600";
        btn.className = "flex items-center gap-1 text-blue-600 font-semibold transition";
      } else {
        icon.className = "fa-solid fa-volume-xmark text-xs text-slate-600";
        btn.className = "flex items-center gap-1 text-slate-600 hover:text-slate-900 transition";
      }
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('status-clock').innerText = now.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
    }

    window.onload = () => {
      renderTabs();
      renderSpecPanel();
      restartCurrentScenario();
      setInterval(updateClock, 1000);
      updateClock();
    };
  </script>
