    let currentScenario = workflows[0];
    let currentStepIdx = 0;
    let isPlaying = true;
    let playbackSpeed = 1;
    let soundEnabled = false;
    let timer = null;

    // Sound Synthesizer
    function playAudio(type) {
      if (!soundEnabled) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        const now = ctx.currentTime;
        if (type === 'send') {
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.start(now); osc.stop(now + 0.08);
        } else {
          osc.frequency.setValueAtTime(600, now);
          osc.frequency.exponentialRampToValueAtTime(400, now + 0.1);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
          osc.start(now); osc.stop(now + 0.1);
        }
      } catch(e) {}
    }

    // Render Tabs
    function renderTabs() {
      const container = document.getElementById('tabs-container');
      container.innerHTML = '';
      workflows.forEach(wf => {
        const btn = document.createElement('button');
        btn.className = `px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition border ${
          wf.id === currentScenario.id 
            ? 'bg-blue-600 border-blue-500 text-white shadow-lg shadow-blue-500/20' 
            : 'bg-slate-900/80 border-slate-800 text-slate-400 hover:text-slate-200 hover:bg-slate-800'
        }`;
        btn.innerHTML = `${wf.name}`;
        btn.onclick = () => selectScenario(wf.id);
        container.appendChild(btn);
      });
    }

    function selectScenario(id) {
      currentScenario = workflows.find(w => w.id === id);
      renderTabs();
      renderSpecPanel();
      restartCurrentScenario();
    }

    function renderSpecPanel() {
      const panel = document.getElementById('architecture-panel');
      let compHtml = currentScenario.cekatComponents.map(c => `<span class="bg-slate-950 border border-slate-700 text-amber-400 font-mono text-[11px] px-2.5 py-1 rounded-md inline-block mr-1 mb-1">${c}</span>`).join('');
      let apiHtml = currentScenario.apiScopes.map(a => `<span class="bg-slate-950 border border-slate-700 text-sky-400 font-mono text-[11px] px-2.5 py-1 rounded-md inline-block mr-1 mb-1">${a}</span>`).join('');
      let stepsHtml = currentScenario.stepsDetail.map(s => `<li class="mb-1.5 leading-relaxed">${s}</li>`).join('');

      let triggerBadgeHtml = currentScenario.triggerType === 'OUTBOUND_SYSTEM'
        ? `<span class="bg-emerald-950 text-emerald-300 border border-emerald-800 font-bold px-2.5 py-0.5 rounded-full text-[10px]">SYSTEM OUTBOUND TRIGGER</span>`
        : `<span class="bg-blue-950 text-blue-300 border border-blue-800 font-bold px-2.5 py-0.5 rounded-full text-[10px]">USER INBOUND CHAT</span>`;

      panel.innerHTML = `
        <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4 space-y-2">
          <div class="font-extrabold text-sm text-sky-400 flex items-center gap-2">
            <i class="fa-solid fa-sitemap"></i> ${currentScenario.title}
          </div>
          <div class="flex items-center gap-2 pt-1">
            ${triggerBadgeHtml}
            <span class="bg-indigo-950 text-indigo-300 border border-indigo-800 font-bold px-2.5 py-0.5 rounded-full text-[10px]">SA: ${currentScenario.saAuthor}</span>
            <span class="bg-slate-800 text-slate-300 font-mono font-bold px-2.5 py-0.5 rounded-full text-[10px] border border-slate-700">${currentScenario.tag}</span>
          </div>
        </div>

        <div class="bg-red-950/40 border border-red-900/60 rounded-2xl p-4 space-y-1">
          <div class="font-bold text-red-400 flex items-center gap-2 text-xs">
            <i class="fa-solid fa-triangle-exclamation"></i> Batasan Medis / Legal / Limitasi Native (Constraint)
          </div>
          <p class="text-red-200 text-[11.5px] leading-relaxed font-medium">${currentScenario.constraint}</p>
        </div>

        <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4 space-y-2">
          <div class="font-bold text-sky-400 flex items-center gap-2 text-xs">
            <i class="fa-solid fa-microchip"></i> Workaround SA & Komponen Cekat AI
          </div>
          <div>${compHtml}</div>
        </div>

        <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4 space-y-2">
          <div class="font-bold text-sky-400 flex items-center gap-2 text-xs">
            <i class="fa-solid fa-network-wired"></i> Scope API SIMRS yang Dibutuhkan
          </div>
          <div>${apiHtml}</div>
        </div>

        <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4 space-y-1">
          <div class="font-bold text-sky-400 flex items-center gap-2 text-xs">
            <i class="fa-solid fa-shield-halved"></i> Key Architecture Rule
          </div>
          <p class="text-slate-300 italic text-[11.5px] leading-relaxed">${currentScenario.ruleNote}</p>
        </div>

        <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4 space-y-2">
          <div class="font-bold text-sky-400 flex items-center gap-2 text-xs">
            <i class="fa-solid fa-list-check"></i> Step-by-Step Workflow
          </div>
          <ol class="list-decimal list-inside text-slate-300 text-[11.5px] space-y-1 pl-1">
            ${stepsHtml}
          </ol>
        </div>
      `;
    }

    function restartCurrentScenario() {
      clearTimeout(timer);
      currentStepIdx = 0;
      const canvas = document.getElementById('chat-canvas');
      canvas.innerHTML = '';

      // Time Divider
      const div = document.createElement('div');
      div.className = 'flex items-center gap-2 my-2 animate-fade-up';
      div.innerHTML = `<div class="h-px bg-slate-300 flex-1"></div><span class="text-[10px] text-slate-500 font-semibold bg-[#ECE5DD] px-2">HARI INI</span><div class="h-px bg-slate-300 flex-1"></div>`;
      canvas.appendChild(div);

      // If OUTBOUND_SYSTEM: Render System Pill & RS Bot Message First (on LEFT)!
      if (currentScenario.triggerType === 'OUTBOUND_SYSTEM') {
        if (currentScenario.outboundPill) {
          const pill = document.createElement('div');
          pill.className = 'flex justify-center my-1 animate-fade-up';
          pill.innerHTML = `<span class="bg-slate-900 text-sky-400 border border-sky-500/30 text-[10px] font-bold px-3 py-0.5 rounded-full">${currentScenario.outboundPill}</span>`;
          canvas.appendChild(pill);
        }
        
        // Outbound Msg from RS Bot -> KIRI ('rs-bot')
        appendMsg('rs-bot', currentScenario.initialText);
        renderChips(currentScenario.steps[0]?.chips || []);

        if (isPlaying && currentScenario.steps.length > 0) {
          timer = setTimeout(() => {
            runStep(0, currentScenario.steps[0].userReply);
          }, 2200 / playbackSpeed);
        }
      } else {
        // INBOUND_USER: Initial Msg from Patient -> KANAN ('patient')
        appendMsg('patient', currentScenario.initialText);
        renderChips(currentScenario.steps[0]?.chips || []);

        if (isPlaying && currentScenario.steps.length > 0) {
          timer = setTimeout(() => {
            runStep(0, currentScenario.steps[0].userReply);
          }, 1600 / playbackSpeed);
        }
      }
    }

    /* Standard WhatsApp Alignment Rules:
       - rs-bot (RS Sehat Utama / Bot) -> KIRI (flex-start, White Bubble #ffffff)
       - patient (Pasien / User) -> KANAN (flex-end, Light Green #d9fdd3)
    */
    function appendMsg(senderRole, text) {
      const canvas = document.getElementById('chat-canvas');
      const isBot = senderRole === 'rs-bot';

      const wrap = document.createElement('div');
      wrap.className = `flex flex-col ${isBot ? 'items-start' : 'items-end'} mb-2 animate-fade-up`;

      const bubble = document.createElement('div');
      bubble.className = `${
        isBot 
          ? 'bg-white text-slate-900 rounded-2xl rounded-tl-none border border-slate-100 shadow-sm' 
          : 'bg-[#d9fdd3] text-slate-900 rounded-2xl rounded-tr-none border border-[#c7f3be] shadow-sm'
      } px-3 py-2 text-xs leading-relaxed max-w-[85%] whitespace-pre-line`;
      
      bubble.innerHTML = text.replace(/\*(.*?)\*/g, '<strong>$1</strong>');

      const ts = document.createElement('span');
      ts.className = 'text-[9.5px] text-slate-400 mt-0.5 font-medium px-1 flex items-center gap-1';
      ts.innerHTML = `${new Date().toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'})} ${!isBot ? '<i class="fa-solid fa-check-double text-sky-500"></i>' : ''}`;

      wrap.appendChild(bubble);
      wrap.appendChild(ts);
      canvas.appendChild(wrap);
      canvas.scrollTop = canvas.scrollHeight;

      playAudio(!isBot ? 'send' : 'receive');
    }

    function appendCard(cardObj) {
      if (!cardObj) return;
      const canvas = document.getElementById('chat-canvas');
      const wrap = document.createElement('div');
      wrap.className = 'flex flex-col items-start mb-2 animate-fade-up max-w-[90%]';

      let itemsHtml = cardObj.items.map(item => `
        <div class="flex justify-between items-center py-1 border-t border-slate-100 text-[11px] gap-4">
          <span class="text-slate-500 font-medium">${item.label}</span>
          <span class="text-slate-900 font-bold text-right">${item.val}</span>
        </div>
      `).join('');

      wrap.innerHTML = `
        <div class="bg-white rounded-2xl overflow-hidden shadow-md border border-slate-200 w-full text-xs">
          <div class="p-3">
            <div class="font-extrabold text-[#075E54] text-xs flex items-center gap-1.5 mb-0.5">
              <i class="fa-solid fa-circle-check"></i> ${cardObj.title}
            </div>
            <div class="text-[10px] text-slate-400 mb-2 font-medium">${cardObj.sub}</div>
            ${itemsHtml}
          </div>
          <div class="bg-[#075E54] text-white text-[10px] font-bold py-1.5 px-3 text-center tracking-wide uppercase">
            ${cardObj.status}
          </div>
        </div>
      `;

      canvas.appendChild(wrap);
      canvas.scrollTop = canvas.scrollHeight;
    }

    function renderChips(chipsList) {
      const row = document.getElementById('quick-chips');
      row.innerHTML = '';
      if (!chipsList) return;

      chipsList.forEach(txt => {
        const chip = document.createElement('button');
        chip.className = 'bg-white hover:bg-slate-50 text-[#075E54] border border-[#075E54] text-[11px] font-semibold px-3 py-1 rounded-full whitespace-nowrap shadow-xs cursor-pointer active:scale-95 transition shrink-0';
        chip.innerText = txt;
        chip.onclick = () => onChipClick(txt);
        row.appendChild(chip);
      });
    }

    function onChipClick(txt) {
      clearTimeout(timer);
      if (currentStepIdx < currentScenario.steps.length) {
        runStep(currentStepIdx, txt);
      }
    }

    function handleManualSend() {
      const input = document.getElementById('user-input-field');
      const val = input.value.trim();
      if (val) {
        onChipClick(val);
        input.value = '';
      }
    }

    function runStep(stepIdx, userText) {
      // Pasien Balas -> KANAN ('patient')
      appendMsg('patient', userText);

      // Typing Dots -> KIRI ('rs-bot')
      const canvas = document.getElementById('chat-canvas');
      const typing = document.createElement('div');
      typing.className = 'flex flex-col items-start mb-2 animate-fade-up';
      typing.id = 'typing-dots';
      typing.innerHTML = `
        <div class="bg-white rounded-2xl rounded-tl-none px-3.5 py-2 shadow-sm border border-slate-100 flex items-center gap-1">
          <span class="w-1.5 h-1.5 rounded-full bg-[#075E54] dot-1"></span>
          <span class="w-1.5 h-1.5 rounded-full bg-[#075E54] dot-2"></span>
          <span class="w-1.5 h-1.5 rounded-full bg-[#075E54] dot-3"></span>
        </div>
      `;
      canvas.appendChild(typing);
      canvas.scrollTop = canvas.scrollHeight;

      timer = setTimeout(() => {
        const t = document.getElementById('typing-dots');
        if (t) t.remove();

        const step = currentScenario.steps[stepIdx];
        const botResponse = step ? step.aiResponse : "Terima kasih! Ada hal lain yang bisa Cekat AI bantu?";
        // Bot RS Balas -> KIRI ('rs-bot')
        appendMsg('rs-bot', botResponse);

        if (step && step.card) {
          appendCard(step.card);
        }

        if (step && step.chips) {
          renderChips(step.chips);
        }

        currentStepIdx = stepIdx + 1;

        if (isPlaying && currentStepIdx < currentScenario.steps.length) {
          timer = setTimeout(() => {
            const nextStep = currentScenario.steps[currentStepIdx];
            runStep(currentStepIdx, nextStep.userReply);
          }, 3000 / playbackSpeed);
        }
      }, 2000 / playbackSpeed);
    }

    function togglePlayPause() {
      isPlaying = !isPlaying;
      const btn = document.getElementById('btn-play-toggle');
      const icon = document.getElementById('icon-play');
      const text = document.getElementById('text-play');

      if (isPlaying) {
        btn.className = "flex items-center gap-1.5 bg-amber-500/20 text-amber-300 border border-amber-500/30 px-3 py-1 rounded-full font-semibold transition";
        icon.className = "fa-solid fa-pause text-xs";
        text.innerText = "Pause";
        restartCurrentScenario();
      } else {
        btn.className = "flex items-center gap-1.5 bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-3 py-1 rounded-full font-semibold transition";
        icon.className = "fa-solid fa-play text-xs";
        text.innerText = "Play";
        clearTimeout(timer);
      }
    }

    function setSpeed(sp) {
      playbackSpeed = sp;
      document.querySelectorAll('.speed-btn').forEach(btn => {
        btn.className = btn.innerText === `${sp}x` 
          ? 'speed-btn px-2 py-0.5 rounded font-mono font-bold text-xs bg-blue-600 text-white'
          : 'speed-btn px-2 py-0.5 rounded font-mono font-bold text-xs text-slate-400 hover:text-slate-200';
      });
      if (isPlaying) restartCurrentScenario();
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const icon = document.getElementById('icon-sound');
      const btn = document.getElementById('btn-sound-toggle');

      if (soundEnabled) {
        icon.className = "fa-solid fa-volume-high text-xs text-blue-400";
        btn.className = "flex items-center gap-1 text-blue-400 font-semibold transition";
      } else {
        icon.className = "fa-solid fa-volume-xmark text-xs text-slate-400";
        btn.className = "flex items-center gap-1 text-slate-400 hover:text-white transition";
      }
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('status-clock').innerText = now.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
    }

    window.onload = () => {
      renderTabs();
      renderSpecPanel();
      restartCurrentScenario();
      setInterval(updateClock, 1000);
      updateClock();
    };
  </script>
</body>
</html>
